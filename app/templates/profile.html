<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="chat-body">
    <div class="topbar">
        <div class="topbar-left">
            <div class="topbar-title">Profile</div>
        </div>

        <a class="profile-link" href="/">Chats</a>
    </div>

    <div class="profile-wrapper">
        <div class="profile-card">
            <!-- Name -->
            <div class="profile-row">
                <div class="profile-label">Name</div>
                <div class="profile-value">
                    <span>{{ profile.name }}</span>
                </div>
            </div>
            <hr class="profile-divider" />

            <!-- Email -->
            <div class="profile-row">
                <div class="profile-label">Email address</div>
                <div class="profile-value">
                    <span>{{ profile.email }}</span>
                </div>
            </div>
            <hr class="profile-divider" />

            <!-- Log out -->
            <div class="profile-row">
                <div class="profile-label">Log out of all devices</div>
                <div class="profile-value">
                    <button class="btn-danger" onclick="logout()">Log out</button>
                </div>
            </div>
            <hr class="profile-divider" />

            <!-- Delete account -->
            <div class="profile-row">
                <div class="profile-label">Delete account</div>
                <div class="profile-value">
                    <button class="btn-danger" disabled>Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function logout() {
            if (confirm("Are you sure you want to log out on all devices?")) {
                try {
                    const response = await fetch("/user/logout", {
                        method: "POST",
                        credentials: "include",
                    });
                    if (response.ok) {
                        window.location.href = "/login";
                    }
                } catch (error) {
                    console.error("Logout error:", error);
                }
            }
        }
    </script>
</body>
</html>
